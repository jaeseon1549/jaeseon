<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>生词本 새 단어 공책</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans:wght@500;600&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2E7A5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="단어 공책">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.27.0/dist/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.2/dist/hanzi-writer.min.js"></script>
<style>
:root{
  --paper:#EDF3EE; --surface:#FBFDFB; --ink:#1E2A26; --muted:#5E6E67; --line:#D2DFD6;
  --grid:#2E7A5E; --grid-soft:#C4DBCE; --on-grid:#FFFFFF;
  --pen:#D2362B; --pen-soft:#F6DCD8; --ok-soft:#DCEEE4;
  --f-ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-han:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC","Songti SC",serif;
  --f-py:"Noto Sans","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131B18; --surface:#1A2420; --ink:#E3ECE6; --muted:#98A9A1; --line:#2B3A34;
    --grid:#62B592; --grid-soft:#2C423A; --on-grid:#0E1814;
    --pen:#FF6E60; --pen-soft:#3B2220; --ok-soft:#1F3A2F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131B18; --surface:#1A2420; --ink:#E3ECE6; --muted:#98A9A1; --line:#2B3A34;
  --grid:#62B592; --grid-soft:#2C423A; --on-grid:#0E1814;
  --pen:#FF6E60; --pen-soft:#3B2220; --ok-soft:#1F3A2F;
  color-scheme:dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); background:var(--paper); }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-ui); font-size:16px; line-height:1.6;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:rgba(46,122,94,.16);
  padding-bottom:84px;
}
[hidden]{ display:none !important; }
img,svg,canvas{ max-width:100%; }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--grid); outline-offset:2px; }
.wrap{ max-width:560px; margin:0 auto; padding:0 20px; }
h1,h2,h3,p{ margin:0; }
.han, [lang="zh-CN"]{ font-family:var(--f-han); }
ruby{ ruby-position:over; ruby-align:center; }
rt{ font-family:var(--f-py); font-weight:500; font-size:.36em; color:var(--grid); letter-spacing:0; line-height:1.15; }

/* 田字格 */
.gz{
  --s:40px;
  position:relative; display:inline-grid; place-items:center;
  width:var(--s); height:var(--s);
  border:1.5px solid var(--grid);
  background:
    repeating-linear-gradient(to right, var(--grid-soft) 0 4px, transparent 4px 8px) center / 100% 1px no-repeat,
    repeating-linear-gradient(to bottom, var(--grid-soft) 0 4px, transparent 4px 8px) center / 1px 100% no-repeat,
    var(--surface);
  font-family:var(--f-han); line-height:1; color:var(--ink);
}
.gz + .gz{ margin-left:-1.5px; }

/* 머리 */
.masthead{ padding:18px 0 8px; }
.mh{ display:flex; align-items:flex-end; gap:14px; }
.brand{ flex:none; }
.brand-py{ display:flex; }
.brand-py span{ width:38.5px; text-align:center; font-family:var(--f-py); font-size:11px; font-weight:500; color:var(--grid); line-height:1.4; }
.brand-py span:first-child{ width:40px; }
.brand-gz{ display:flex; }
.brand-gz .gz{ --s:40px; font-size:27px; }
.brand-text{ flex:1; min-width:0; padding-bottom:2px; }
.brand-text h1{ font-size:18px; font-weight:400; line-height:1.3; }
.brand-text p{ font-size:13px; color:var(--muted); }
.icon-btn{
  appearance:none; background:none; border:0; width:44px; height:44px; margin:0 -8px 0 0;
  display:grid; place-items:center; border-radius:10px; cursor:pointer; color:var(--muted);
}
.icon-btn svg{ width:22px; height:22px; }

/* 공용 버튼 */
.btn{
  appearance:none; border:1.5px solid transparent; border-radius:12px;
  font-size:16px; padding:0 18px; min-height:46px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  cursor:pointer; text-decoration:none; color:var(--ink); background:transparent; white-space:nowrap;
}
.btn.primary{ background:var(--grid); color:var(--on-grid); }
.btn.ghost{ border-color:var(--line); background:var(--surface); }
.btn.big{ min-height:54px; font-size:17px; border-radius:14px; }
.btn.sm{ min-height:36px; font-size:14px; padding:0 12px; border-radius:10px; }
.btn.danger{ background:var(--pen); color:#fff; }
.btn.danger-ghost{ color:var(--pen); border-color:var(--pen-soft); background:transparent; }
.btn:disabled{ opacity:.55; cursor:default; }
.btn, .chip, .zoom-btn, .icon-btn, .link, .pad-x, .nav button, .w, .switch{ transition:transform .08s ease, filter .08s ease, background-color .12s ease; }
.btn:not(:disabled):active, .chip:active, .zoom-btn:active, .icon-btn:active, .pad-x:active, .switch:active{ transform:scale(.96); filter:brightness(.92); }
.link:active{ filter:brightness(.8); }
.nav button:active, .w:active{ background:var(--ok-soft); }
.btn.ghost:not(:disabled):active{ background:var(--ok-soft); }
.mic:active{ transform:scale(.96); }
.btn svg{ width:18px; height:18px; }
.link{
  appearance:none; background:none; border:0; padding:8px 2px; font-size:14px; color:var(--muted);
  text-decoration:underline; text-underline-offset:3px; cursor:pointer;
}
textarea{ width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--surface); border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; resize:vertical; }
input[type=text], input[type=search], select{
  width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--surface);
  border:1.5px solid var(--line); border-radius:10px; min-height:46px; padding:0 12px;
}
input::placeholder{ color:var(--muted); opacity:.7; }
select{ appearance:none; padding-right:30px;
  background-image:linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position:calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size:5px 5px; background-repeat:no-repeat; }
.help{ font-size:13px; color:var(--muted); line-height:1.5; }

/* 단어장 */
.add{ margin-top:14px; padding:16px 0 18px; border-top:1.5px solid var(--grid); }
.add-label{ display:block; font-size:15px; margin-bottom:8px; }
.add-row{ display:flex; gap:8px; }
.add-row input{ font-family:var(--f-han); font-size:22px; min-height:52px; }
.add-row .btn{ min-height:52px; padding:0 22px; }
.add .help{ margin-top:8px; }
.fill-row{ display:flex; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap; }
.list-tools{ display:grid; grid-template-columns:1fr auto; gap:8px; margin:6px 0 4px; }
.list-tools select{ width:auto; min-width:128px; }
.list-note{ font-size:13px; color:var(--pen); margin:8px 0 0; }
.wl{ list-style:none; margin:8px 0 0; padding:0; }
.wl > li + li{ border-top:1px solid var(--line); }
.w{
  appearance:none; background:none; border:0; width:100%; text-align:left; cursor:pointer;
  display:grid; grid-template-columns:minmax(76px,auto) 1fr auto; gap:14px; align-items:center;
  padding:10px 2px 12px; color:inherit;
}
.w-han{ font-family:var(--f-han); font-size:28px; line-height:2; white-space:nowrap; }
.w-han rt{ font-size:.42em; }
.w-body{ min-width:0; }
.w-mean{ display:block; font-size:16px; line-height:1.45; overflow-wrap:anywhere; white-space:pre-line; }
.w-pos{ font-size:12px; color:var(--muted); margin-right:6px; }
.w-tags{ display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
.w-go{ color:var(--line); width:16px; height:16px; }
.tag{ display:inline-block; font-size:12px; line-height:20px; padding:0 8px; border-radius:999px; border:1px solid var(--pen); color:var(--pen); white-space:nowrap; }
.tag.new{ border-color:var(--grid); color:var(--grid); }
.tag.need{ background:var(--pen-soft); border-color:transparent; }
.pending{ color:var(--muted); font-size:14px; animation:blink 1.4s ease-in-out infinite; }
@keyframes blink{ 50%{ opacity:.45; } }
.empty{ padding:36px 4px 12px; text-align:left; }
.empty .gz{ --s:56px; font-size:36px; color:var(--grid-soft); }
.empty p{ margin-top:14px; font-size:16px; }
.empty .help{ margin-top:6px; }
.empty .link{ margin-top:6px; }

/* 퀴즈 공통 */
.start{ padding:26px 0 8px; }
.start h2, .summary h2{ font-size:25px; font-weight:400; line-height:1.3; }
.lead{ font-size:16px; margin-top:8px; color:var(--ink); }
.start .lead + .lead{ margin-top:4px; color:var(--muted); }
.fieldset{ margin-top:24px; }
.field-label{ display:block; font-size:14px; color:var(--muted); margin-bottom:8px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{
  appearance:none; cursor:pointer; min-height:40px; min-width:58px; padding:0 14px;
  border-radius:999px; border:1.5px solid var(--line); background:var(--surface); font-size:15px;
}
.chip[aria-pressed="true"]{ border-color:var(--grid); background:var(--ok-soft); color:var(--ink); }
.note{ margin-top:22px; font-size:14px; color:var(--muted); line-height:1.55; }
.start .btn.big{ width:100%; margin-top:18px; }

.q-top{ display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px; padding:14px 0 6px; }
.q-count{ font-family:var(--f-py); font-size:14px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; }
.bar{ height:4px; border-radius:4px; background:var(--grid-soft); overflow:hidden; }
.bar i{ display:block; height:100%; background:var(--grid); transition:width .3s ease; }
.prompt{ text-align:center; padding:26px 0 6px; }
.pos{ font-size:13px; color:var(--muted); min-height:20px; }
.mean{ font-size:29px; line-height:1.35; margin-top:2px; overflow-wrap:anywhere; white-space:pre-line; }
.mean.sent{ font-size:23px; line-height:1.45; }
.slots{ display:flex; justify-content:center; align-items:center; margin-top:14px; }
.slots .gz{ --s:30px; }
.slots-n{ font-size:13px; color:var(--muted); margin-left:10px; }
.slots-n.solo{ margin:10px 0 0; }
.mist{ text-align:center; font-size:14px; color:var(--pen); margin:16px 0 0; min-height:22px; }
.tries{ display:flex; justify-content:center; gap:10px; margin:16px 0 0; }
.try{ position:relative; width:14px; height:14px; border-radius:50%; border:1.5px solid var(--line); }
.try.x{ border-color:var(--pen); }
.try.x::after{ content:""; position:absolute; left:50%; top:-3px; width:1.5px; height:18px; background:var(--pen); transform:translateX(-50%) rotate(40deg); }
.try.o{ border-color:var(--pen); border-width:2px; }

.stage{ display:flex; flex-direction:column; align-items:center; padding:24px 0 4px; }
.mic{
  position:relative; appearance:none; cursor:pointer; width:96px; height:96px; border-radius:50%;
  border:2px solid var(--grid); background:var(--surface); color:var(--grid);
  display:grid; place-items:center;
}
.mic svg{ width:38px; height:38px; }
.mic.on{ background:var(--grid); color:var(--on-grid); }
.mic.on::after{
  content:""; position:absolute; inset:-8px; border-radius:50%; border:2px solid var(--grid);
  animation:ring 1.3s ease-out infinite;
}
@keyframes ring{ from{ transform:scale(.92); opacity:.9; } to{ transform:scale(1.18); opacity:0; } }
.mic-label{ margin-top:12px; font-size:15px; color:var(--muted); text-align:center; }
.live{ min-height:40px; margin-top:6px; font-size:28px; text-align:center; color:var(--grid); }
.self-note{ font-size:16px; text-align:center; color:var(--muted); max-width:30ch; }
.stage.kbd{ align-items:stretch; padding-top:22px; }
.kbd-label{ font-size:15px; color:var(--muted); text-align:center; line-height:1.5; }
.kbd-row{ display:flex; gap:8px; margin-top:12px; }
.kbd-row input{ font-family:var(--f-han); font-size:24px; min-height:56px; text-align:center; }
.kbd-row .btn{ min-height:56px; padding:0 20px; }
.kbd-help{ margin-top:14px; font-size:14px; color:var(--muted); border-top:1px solid var(--line); padding-top:6px; }
.kbd-help summary{ cursor:pointer; color:var(--ink); padding:8px 0; }
.kbd-help p{ margin-top:6px; line-height:1.6; }
.kbd-help b{ color:var(--ink); font-weight:400; margin-right:4px; }
.stage-links{ display:flex; justify-content:center; flex-wrap:wrap; gap:4px 18px; margin-top:6px; }

.feedback{ text-align:center; min-height:24px; }
.fb-msg{ font-size:15px; color:var(--pen); margin-top:6px; }
.fb-msg.calm{ color:var(--muted); }
.heard{ display:flex; flex-wrap:wrap; justify-content:center; align-items:baseline; gap:4px 10px; margin-top:8px; font-size:15px; }
.heard-label{ font-size:13px; color:var(--muted); }
.heard .han{ font-size:24px; }
.heard .py{ font-family:var(--f-py); font-size:14px; color:var(--muted); }
.pct{ font-family:var(--f-py); font-weight:600; font-size:14px; }
.pct.no{ color:var(--pen); } .pct.ok{ color:var(--grid); }
.hint{ margin-top:8px; font-size:15px; }
.hint b{ font-family:var(--f-py); font-weight:600; color:var(--grid); }
.notes{ list-style:none; padding:0; margin:8px 0 0; font-size:14px; color:var(--pen); }

.actions{ display:flex; justify-content:center; align-items:center; gap:10px; margin-top:22px; flex-wrap:wrap; }
.actions .btn.big{ flex:1 1 180px; max-width:320px; }
.actions.col{ flex-direction:column; align-items:stretch; }
.actions.col .btn{ max-width:none; }
.override{ display:block; margin:8px auto 0; }
.pair{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
.q-ask{ text-align:center; font-size:16px; margin-top:18px; }

.answer{ text-align:center; padding:18px 0 0; }
.ans-han{ position:relative; display:inline-block; font-family:var(--f-han); font-size:58px; line-height:1.9; padding:0 6px; }
.ans-han rt{ font-size:.3em; }
.ans-mean{ font-size:16px; color:var(--muted); margin-top:-4px; white-space:pre-line; }
.verdict{ text-align:center; font-size:16px; margin-top:12px; }
.verdict.no{ color:var(--pen); }
.sent-note{ max-width:34ch; margin:14px auto 0; padding:12px 14px; border-radius:12px; background:var(--ok-soft); font-size:14px; line-height:1.6; text-align:left; }
.sent-note p + p{ margin-top:4px; }
.sent-word{ font-family:var(--f-han); font-size:17px; }
.mark-svg{ position:absolute; pointer-events:none; overflow:visible; max-width:none; max-height:none; transform:rotate(-2deg); }
.mark-svg path{ fill:none; stroke:var(--pen); stroke-width:3.6; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1; stroke-dashoffset:1; animation:draw .55s cubic-bezier(.5,.1,.35,1) .08s forwards; }
@keyframes draw{ to{ stroke-dashoffset:0; } }

/* 쓰기 */
.pads-wrap{ display:flex; justify-content:center; padding-top:22px; }
.pads-in{ position:relative; display:inline-block; }
.pads{ display:flex; flex-wrap:wrap; justify-content:center; }
.pad{
  position:relative; width:var(--s); height:var(--s); margin:0 -1.5px -1.5px 0;
  border:1.5px solid var(--grid);
  background:
    repeating-linear-gradient(to right, var(--grid-soft) 0 6px, transparent 6px 12px) center / 100% 1px no-repeat,
    repeating-linear-gradient(to bottom, var(--grid-soft) 0 6px, transparent 6px 12px) center / 1px 100% no-repeat,
    var(--surface);
}
.pad.bad{ border-color:var(--pen); z-index:1; }
.pad canvas{ display:block; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; cursor:crosshair; }
.pads.locked canvas{ cursor:default; }
.pad-x{
  position:absolute; top:2px; right:2px; width:30px; height:30px; border-radius:8px; border:0; cursor:pointer;
  background:transparent; color:var(--muted); font-size:18px; line-height:1;
}
.hw-box{ width:100%; height:100%; display:grid; place-items:center; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
.hw-box svg{ display:block; touch-action:none; }
.hw-guide{ text-align:center; font-size:14px; color:var(--muted); margin-top:12px; line-height:1.5; }
.pad-tools{ display:flex; justify-content:center; gap:18px; margin-top:4px; }
.pad-zoom{ display:flex; align-items:center; justify-content:center; gap:14px; margin-top:12px; font-size:13px; color:var(--muted); }
.zoom-btn{ appearance:none; width:38px; height:38px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); font-size:20px; line-height:1; cursor:pointer; }

/* 결과 */
.summary{ padding:26px 0 8px; }
.sheet{ display:flex; flex-wrap:wrap; margin-top:18px; }
.sheet .gz{ --s:38px; margin:0 -1.5px -1.5px 0; }
.sheet svg{ width:26px; height:26px; fill:none; stroke:var(--pen); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
.sheet-legend{ margin-top:12px; font-size:15px; }
.summary h3{ font-size:16px; font-weight:400; color:var(--muted); margin-top:26px; }
.rv{ display:grid; grid-template-columns:minmax(76px,auto) 1fr auto; gap:14px; align-items:center; padding:6px 0 8px; }

/* 메뉴 */
.nav{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  background:var(--surface); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.nav-in{ max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); }
.nav button{
  appearance:none; background:none; border:0; cursor:pointer; position:relative;
  min-height:62px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-size:13px; color:var(--muted);
}
.nav svg{ width:24px; height:24px; }
.nav button[aria-current="page"]{ color:var(--ink); }
.nav button[aria-current="page"]::before{ content:""; position:absolute; top:-1px; left:30%; right:30%; height:3px; background:var(--grid); border-radius:0 0 3px 3px; }

.toast{
  position:fixed; left:50%; bottom:calc(76px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  z-index:30; width:max-content; max-width:calc(100% - 32px);
  display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:12px;
  background:var(--ink); color:var(--paper); font-size:14px; line-height:1.45;
}
.toast button{ appearance:none; border:0; background:none; color:var(--grid-soft); font-size:14px; text-decoration:underline; cursor:pointer; padding:4px 0; white-space:nowrap; }

/* 대화상자 */
dialog{
  width:calc(100% - 24px); max-width:500px; max-height:calc(100% - 40px); padding:0;
  border:1px solid var(--line); border-radius:16px; background:var(--surface); color:var(--ink);
  overflow:auto;
}
dialog::backdrop{ background:rgba(10,20,16,.45); }
.dlg-in{ padding:18px 20px 20px; }
.dlg-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.dlg-title{ font-size:18px; }
.pr-mean{ text-align:center; font-size:17px; line-height:1.5; white-space:pre-line; margin-bottom:6px; }
.btn-row.center{ justify-content:center; }
.dlg-foot{ display:flex; justify-content:space-between; gap:10px; margin-top:22px; }
.dlg-foot.end{ justify-content:flex-end; }
.ed-han{ text-align:center; font-family:var(--f-han); font-size:48px; line-height:1.9; }
.ed-links{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:4px 0 12px; }
.field{ display:block; margin-top:14px; }
.field > span{ display:block; font-size:14px; color:var(--muted); margin-bottom:6px; }
.field small{ font-size:12px; }
.rec{ width:100%; border-collapse:collapse; margin-top:18px; font-size:14px; }
.rec caption{ text-align:left; font-size:14px; color:var(--muted); padding-bottom:4px; }
.rec th, .rec td{ text-align:left; padding:6px 4px; border-top:1px solid var(--line); font-weight:400; }
.rec td{ font-variant-numeric:tabular-nums; }

.range-val{ min-width:68px; text-align:right; font-size:15px; font-variant-numeric:tabular-nums; }
.confirm-msg{ font-size:16px; line-height:1.55; }
textarea.backup{ width:100%; min-height:180px; font-family:ui-monospace,monospace; font-size:12px; border:1.5px solid var(--line); border-radius:10px; background:var(--paper); color:var(--ink); padding:10px; margin-top:10px; }

@media (max-width:380px){

<script>
(() => {
'use strict';

/* ───────── 기본 도구 ───────── */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const HAN_RE = /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/;
const HAN_G = /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/g;
const onlyHan = s => (String(s || '').match(HAN_G) || []).join('');
const chars = s => [...s];
const clip = (s, n = 40) => { s = String(s ?? '').trim(); return s.length > n ? s.slice(0, n) + '…' : s; };
const PY = (window.pinyinPro && typeof window.pinyinPro.pinyin === 'function') ? window.pinyinPro : null;
const MAXW = 9;
const KEY = 'shengciben.v1';
const NAVER = hz => 'https://zh.dict.naver.com/#/search?query=' + encodeURIComponent(hz);

/* ───────── 뜻 찾기: 무료 번역 서비스 (구글 번역 → MyMemory 순서로 시도) ───────── */
async function fetchJSON(url, ms = 8000) {
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), ms);
  try {
    const r = await fetch(url, { signal: ac.signal });
    if (!r.ok) throw new Error('http ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
const POS_KO = { noun: '명사', verb: '동사', adjective: '형용사', adverb: '부사', pronoun: '대명사', preposition: '개사', conjunction: '접속사', interjection: '감탄사', particle: '조사', numeral: '수사', number: '수사', 'measure word': '양사', classifier: '양사', abbreviation: '약어', phrase: '구', prefix: '접두사', suffix: '접미사' };
const okMeaning = m => !!m && !HAN_RE.test(m) && /[가-힣]/.test(m);
/* 네이버 중국어사전을 먼저 시도해요. 브라우저가 막으면 조용히 번역기로 넘어가요 */
let naverOff = 0;
const stripTags = t => String(t || '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
async function fromNaver(hz) {
  if (naverOff >= 2) return null;
  try {
    const d = await fetchJSON(`https://zh.dict.naver.com/api3/zhko/search?query=${encodeURIComponent(hz)}&m=mobile&range=word&lang=ko`, 6000);
    const items = (((d || {}).searchResultMap || {}).searchResultListMap || {}).WORD;
    const list = (items && items.items) || [];
    const hit = list.find(x => stripTags(x.expEntry) === hz) || list[0];
    if (!hit) { naverOff = 0; return null; }
    const groups = [];
    for (const mc of (hit.meansCollector || [])) {
      const label = stripTags(mc.partOfSpeech);
      const terms = [];
      for (const mn of (mc.means || [])) {
        const t = stripTags(mn.value).replace(/^\d+\.\s*/, '');
        if (t && okMeaning(t) && terms.length < 3 && !terms.includes(t)) terms.push(t);
      }
      if (terms.length) groups.push({ label, terms });
      if (groups.length >= 3) break;
    }
    naverOff = 0;
    if (!groups.length) return null;
    return {
      mean: groups.map(g => (g.label ? g.label + ': ' : '') + g.terms.join(', ')).join('\n'),
      pos: groups.map(g => g.label).filter(Boolean).join(', '),
      src: 'naver',
    };
  } catch (e) { naverOff++; return null; }
}
async function fromGoogle(hz) {
  for (const client of ['gtx', 'at']) {
    try {
      const d = await fetchJSON(`https://translate.googleapis.com/translate_a/single?client=${client}&sl=zh-CN&tl=ko&hl=ko&dt=t&dt=bd&q=${encodeURIComponent(hz)}`);
      const tr = Array.isArray(d && d[0]) ? d[0].map(x => (x && x[0]) || '').join('').trim() : '';
      const groups = [];
      for (const e of (Array.isArray(d[1]) ? d[1] : [])) {
        if (!Array.isArray(e)) continue;
        const raw = e[0] ? String(e[0]).trim() : '';
        const label = POS_KO[raw.toLowerCase()] || (/[가-힣]/.test(raw) ? raw : '');
        const terms = [];
        for (const t of (Array.isArray(e[1]) ? e[1] : [])) if (okMeaning(t) && terms.length < 3 && !terms.includes(t)) terms.push(t);
        if (terms.length) groups.push({ label, terms });
        if (groups.length >= 3) break;
      }
      if (groups.length) {
        return {
          mean: groups.map(g => (g.label ? g.label + ': ' : '') + g.terms.join(', ')).join('\n'),
          pos: groups.map(g => g.label).filter(Boolean).join(', '),
        };
      }
      const plain = tr.replace(/[.。!！]+$/, '');
      if (okMeaning(plain)) return { mean: plain, pos: '' };
    } catch (e) {}
  }
  return null;
}
const KO_ADJ = new Set(['좋다','나쁘다','크다','작다','많다','적다','높다','낮다','길다','짧다','넓다','좁다','덥다','춥다','뜨겁다','차갑다','맵다','짜다','달다','시다','비싸다','싸다','빠르다','느리다','새롭다','같다','다르다','쉽다','어렵다','젊다','어리다','늙다','멀다','가깝다','무겁다','가볍다','밝다','어둡다','두껍다','얇다','건강하다','행복하다','피곤하다','조용하다','시끄럽다','깨끗하다','더럽다','친절하다','편하다','불편하다','중요하다','필요하다','유명하다','간단하다','복잡하다','안전하다','위험하다','따뜻하다','시원하다','심심하다','특별하다','비슷하다','이상하다','신선하다','바쁘다','예쁘다','기쁘다','슬프다','아프다','배고프다','목마르다','귀엽다','맛있다','맛없다','재미있다','재미없다','멋있다','즐겁다']);
const ADJ_TAIL = /(있다|없다|쁘다|프다|렵다|럽다|겁다|깝다|스럽다|롭다|답다|맑다|맞다)$/;
const ADV_TAIL = /(히|이|게|로|씩|껏|만큼)$/;
function guessPos(w) {
  const m = m1(w);
  if (!m) return '';
  if (NUM_KO.has(m) || /^[0-9]+$/.test(m)) return '수사';
  if (m.endsWith('다')) return (KO_ADJ.has(m) || ADJ_TAIL.test(m)) ? '형용사' : '동사';
  if (ADV_TAIL.test(m)) return '';
  if (/[가-힣]$/.test(m)) return '명사';
  return '';
}
async function posLabels(hz, tl) {
  const out = [];
  for (const client of ['gtx', 'at']) {
    try {
      const d = await fetchJSON(`https://translate.googleapis.com/translate_a/single?client=${client}&sl=zh-CN&tl=${tl}&hl=${tl}&dt=bd&q=${encodeURIComponent(hz)}`);
      for (const e of (Array.isArray(d && d[1]) ? d[1] : [])) {
        const raw = (e && e[0]) ? String(e[0]).trim() : '';
        if (!raw) continue;
        const ko = POS_KO[raw.toLowerCase()] || (/[가-힣]/.test(raw) ? raw : '');
        if (ko && !out.includes(ko)) out.push(ko);
      }
      if (out.length) return out;
    } catch (e) {}
  }
  return out;
}
async function fetchPos(w) {
  const found = [];
  for (const tl of ['ko', 'en']) {
    for (const p of await posLabels(w.hz, tl)) if (!found.includes(p)) found.push(p);
    if (found.length >= 2) break;
  }
  if (!found.length) return guessPos(w);
  const g = guessPos(w);
  if (g && !found.includes(g)) found.push(g);
  return found.slice(0, 3).join(', ');
}
async function busy(btn, label, fn) {
  if (!btn || btn.disabled) return;
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = label;
  try { await fn(); } finally { btn.disabled = false; btn.textContent = old; }
}
async function fillGaps() {
  if (navigator.onLine === false) { toast('인터넷에 연결된 뒤 다시 눌러 주세요.'); return; }
  const noMean = S.words.filter(w => !w.mean).slice(0, 40);
  if (noMean.length) await lookup(noMean, true);
  await fillPos(true);
  renderWords();
}
let posRunning = false;
async function fillPos(manual) {
  if (posRunning) return;
  const todo = S.words.filter(w => w.mean && !POS_KINDS(w.pos).length);
  if (!todo.length) { if (manual) toast('문장에 쓸 품사가 모두 채워져 있어요.'); return; }
  if (navigator.onLine === false) { if (manual) toast('인터넷에 연결된 뒤 다시 눌러 주세요.'); return; }
  posRunning = true;
  if (manual) toast(`단어 ${todo.length}개의 품사를 찾고 있어요…`);
  let n = 0;
  for (const w of todo.slice(0, manual ? 60 : 10)) {
    if (!S.words.includes(w)) continue;
    let p = '';
    try { p = await fetchPos(w); } catch (e) { p = guessPos(w); }
    if (p) { w.pos = clip(p, 18); n++; touch(w); }
  }
  posRunning = false;
  if (n) { renderWords(); if (view === 'sn') renderQuiz('sn'); }
  if (manual) toast(n ? `단어 ${n}개의 품사를 채웠어요.` : '품사를 찾지 못했어요. 단어를 눌러 직접 넣어 주세요.');
}

async function fromMyMemory(hz) {
  try {
    const d = await fetchJSON(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(hz)}&langpair=zh-CN|ko`);
    const t = String((d && d.responseData && d.responseData.translatedText) || '').trim().replace(/[.。!！]+$/, '');
    if (/MYMEMORY|QUERY LENGTH|INVALID|LIMIT/i.test(t) || !okMeaning(t)) return null;
    return { mean: t, pos: '' };
  } catch (e) { return null; }
}

/* ───────── 저장소: 이 휴대폰(브라우저)에 저장 ───────── */
const stat = () => ({ w: 1, n: 0, seen: 0, ok1: 0, ok2: 0, miss: 0, last: 0 });
const defaults = () => ({ v: 1, words: [], sents: {}, settings: { pass: 70, len: 10, autoSpeak: true, spMethod: 'auto', kbdOk: false, wrMethod: 'stroke', wrMiss: 5, backStroke: false, padScale: 1, lastBackup: 0, lastNag: 0 } });
let S = defaults();
let storageOK = true;
const R = { state: 'local' };

function normWord(w) {
  if (!w || typeof w.hz !== 'string' || !onlyHan(w.hz)) return null;
  const hz = onlyHan(w.hz);
  return {
    id: String(w.id || uid()),
    hz,
    py: Array.isArray(w.py) && w.py.length ? w.py.map(String) : pyArr(hz),
    mean: String(w.mean || ''),
    pos: String(w.pos || ''),
    added: +w.added || Date.now(),
    st: (w.st === 'pending' || !w.st) ? (w.mean ? 'done' : 'failed') : String(w.st),
    sp: { ...stat(), ...(w.sp || {}) },
    wr: { ...stat(), ...(w.wr || {}) },
    sn: { ...stat(), ...(w.sn || {}) },
  };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d && Array.isArray(d.words)) {
      S = { ...defaults(), settings: { ...defaults().settings, ...(d.settings || {}) }, sents: (d.sents && typeof d.sents === 'object') ? d.sents : {}, words: d.words.map(normWord).filter(Boolean) };
    }
  } catch (e) { storageOK = false; }
}
let saveTimer = null;
function flush() {
  clearTimeout(saveTimer); saveTimer = null;
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { if (storageOK) { storageOK = false; toast('이 브라우저에 저장하지 못했어요. 설정에서 백업 파일을 저장해 두세요.'); } }
}
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 200); }
const touch = () => save();
const touchId = () => save();
const touchSettings = () => save();
addEventListener('pagehide', () => { if (saveTimer) flush(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) flush(); });
/* 브라우저가 저장 공간을 함부로 비우지 않도록 요청 */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
const byId = id => S.words.find(w => w.id === id);
const eligible = () => S.words.filter(w => w.mean && w.st !== 'pending');

/* ───────── 병음 ───────── */
function pyArr(hz) {

  const two = n => n < 10 ? d[n] : (n < 20 ? '十' + (n % 10 ? d[n % 10] : '') : d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : ''));

  const bad = parts.filter(p => !HAN_RE.test(p));
  const cleaned = [...new Set(parts.filter(p => HAN_RE.test(p)).map(onlyHan))];
  const have = new Set(S.words.map(w => w.hz));
  const dup = cleaned.filter(h => have.has(h));

  if (fresh.length > 30) { cut = fresh.length - 30; fresh = fresh.slice(0, 30); }
  const now = Date.now();
  const made = fresh.map((hz, i) => ({ id: uid(), hz, py: pyArr(hz), mean: '', pos: '', added: now + (fresh.length - i), st: 'pending', sp: stat(), wr: stat(), sn: stat() }));
  S.words.push(...made);
  touch(...made);
  try { renderWords(); } catch (e) {}
  const msgs = [];
  if (dup.length) msgs.push(`이미 있는 단어: ${dup.join(' ')}`);
  if (bad.length) msgs.push(`중국어가 아니라 뺐어요: ${clip(bad.join(' '), 20)}`);

    return false;
  }
  let found = 0;
  for (const w of words) {
    if (!S.words.includes(w)) continue;
    const r = (await fromNaver(w.hz)) || (await fromGoogle(w.hz)) || (await fromMyMemory(w.hz));
    if (r) { w.mean = clip(String(r.mean).replace(/[ \t]+/g, ' ').trim(), 140); if (r.pos) w.pos = clip(r.pos, 18); w.st = 'done'; found++; }
    else if (w.st === 'pending' || !w.mean) w.st = 'failed';

  sess.doneChars.add(i);
  if (sess.doneChars.size >= n) setTimeout(() => {
    if (sessions[sess.mode] === sess && sess.cur === wid && sess.phase === 'ask') finish(sess, sess.fails === 0 ? 'first' : 'retry');
  }, 350);
}

/* 직접 쓰기(획순 채점을 못 쓸 때) */
function paintStrokes(ctx, strokes, size, color, lw) {
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const st of strokes) {
    if (!st.length) continue;
    if (st.length === 1) { ctx.beginPath(); ctx.arc(st[0][0] * size, st[0][1] * size, lw / 2, 0, Math.PI * 2); ctx.fill(); continue; }
    ctx.beginPath(); ctx.moveTo(st[0][0] * size, st[0][1] * size);
    for (let k = 1; k < st.length - 1; k++) {
      const mx = (st[k][0] + st[k + 1][0]) / 2 * size, my = (st[k][1] + st[k + 1][1]) / 2 * size;
      ctx.quadraticCurveTo(st[k][0] * size, st[k][1] * size, mx, my);
    }
    const L = st[st.length - 1]; ctx.lineTo(L[0] * size, L[1] * size); ctx.stroke();
  }
}
function mountCanvasPads(sess, w) {
  const wrap = $('#pads'); if (!wrap) return;
  const cs = chars(w.hz);
  if (!sess.strokes || sess.strokes.length !== cs.length) { sess.strokes = cs.map(() => []); sess.hist = []; }
  const size = sizePads(wrap, cs.length);
  const editable = sess.phase === 'ask';
  wrap.innerHTML = cs.map((c, i) => `<div class="pad"><canvas aria-label="${i + 1}번째 글자 쓰는 칸"></canvas>${editable ? `<button type="button" class="pad-x" data-act="clearbox" data-i="${i}" aria-label="${i + 1}번째 칸 지우기" ${sess.strokes[i].length ? '' : 'hidden'}>×</button>` : ''}</div>`).join('');
  $$('canvas', wrap).forEach((cv, i) => setupCanvas(cv, i, size, sess, editable));
}
function setupCanvas(cv, i, size, sess, editable) {
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width = Math.round(size * dpr); cv.height = Math.round(size * dpr);
  cv.style.width = size + 'px'; cv.style.height = size + 'px';
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const color = inkColor(); const lw = Math.max(4, size * 0.058);
  const draw = () => { ctx.clearRect(0, 0, size, size); paintStrokes(ctx, sess.strokes[i], size, color, lw); };
  draw();
  if (!editable) return;
  let cur = null;
  const pt = e => { const r = cv.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; };
  cv.addEventListener('pointerdown', e => {
    if (sess.phase !== 'ask') return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    cur = [pt(e)]; sess.strokes[i].push(cur); sess.hist.push(i); draw();
    const x = cv.parentElement.querySelector('.pad-x'); if (x) x.hidden = false;
  });
  cv.addEventListener('pointermove', e => {
    if (!cur) return; e.preventDefault();
    const evs = typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) cur.push(pt(ev));
    draw();
  });
  const end = () => { if (!cur) return; cur = null; draw(); };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('lostpointercapture', end);
  cv.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
}
function submitWriting(sess) {
  if (!sess || sess.phase !== 'ask') return;
  const w = itemOf(sess); if (!w) return;
  if (!sess.strokes || !sess.strokes.some(st => st.length)) { sess.msg = '칸에 글자를 써 주세요.'; sess.msgCalm = true; renderQuiz(sess.mode); return; }
  sess.phase = 'selfcheck'; renderQuiz(sess.mode);
  if (S.settings.autoSpeak) speak(w.hz);
}

/* 빨간 펜 표시 */
function circlePath(cx, cy, rx, ry) {
  // 매끈한 타원을 한 바퀴 그리고, 끝을 살짝 안쪽으로 겹쳐 펜으로 그은 느낌만 남김
  const N = 96, start = -Math.PI * 0.6, sweep = Math.PI * 2 * 1.1;
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const p = i / N;
    const t = start - sweep * p;
    let k = 1;
    if (p < 0.06) k = 0.975 + (p / 0.06) * 0.025;
    else if (p > 0.9) k = 1 - ((p - 0.9) / 0.1) * 0.05;
    pts.push([cx + Math.cos(t) * rx * k, cy + Math.sin(t) * ry * k]);
  }
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    d += ` Q${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}`;
  }
  const L = pts[pts.length - 1];
  return d + ` L${L[0].toFixed(1)} ${L[1].toFixed(1)}`;
}
const slashPath = (W, H) => `M${(W * 0.14).toFixed(1)} ${(H * 0.9).toFixed(1)} Q${(W * 0.52).toFixed(1)} ${(H * 0.46).toFixed(1)} ${(W * 0.86).toFixed(1)} ${(H * 0.1).toFixed(1)}`;
function drawMark(host, kind) {
  const paint = () => {
    const old = host.querySelector('.mark-svg');
    if (old) old.remove();
    const r = host.getBoundingClientRect();
    if (!r.width) return;
    let W, H, left, top, d;
    if (kind === 'circle') {
      const vw = document.documentElement.clientWidth;
      const py = Math.min(42, Math.min(r.width, r.height) * 0.2 + 10);
      let px = py;
      px = Math.max(4, Math.min(px, r.left - 8, vw - r.right - 8));
      const rx = r.width / 2 + px, ry = r.height / 2 + py, m = 4;
      W = 2 * (rx + m); H = 2 * (ry + m); left = -(px + m); top = -(py + m);
      d = circlePath(W / 2, H / 2, rx, ry);
    } else {
      W = r.width + 8; H = r.height + 8; left = -4; top = -4;
      d = slashPath(W, H);
    }
    host.insertAdjacentHTML('beforeend', `<svg class="mark-svg" width="${W.toFixed(1)}" height="${H.toFixed(1)}" viewBox="0 0 ${W.toFixed(1)} ${H.toFixed(1)}" style="left:${left.toFixed(1)}px;top:${top.toFixed(1)}px" aria-hidden="true"><path pathLength="1" d="${d}"/></svg>`);
  };
  paint();
  /* 글꼴이 늦게 불러와지면 글자 크기가 바뀌므로 다 불러온 뒤 다시 그림 */
  try {
    if (document.fonts && document.fonts.status !== 'loaded') {
      document.fonts.ready.then(() => { if (host.isConnected) paint(); }).catch(() => {});
    }
  } catch (e) {}
}

/* 결과 화면 */
function renderSummary(mode, root, sess) {
  const r = sess.results;
  if (!r.length && !sess.passed) { sess.phase = 'start'; renderStart(mode, root); return; }
  const c = { first: 0, retry: 0, miss: 0 };
  r.forEach(x => c[x.outcome]++);
  const seen = new Set(); const review = [];
  r.forEach(x => { if (x.outcome !== 'first' && !seen.has(x.id)) { seen.add(x.id); const w = byId(x.id); if (w) review.push(w); } });
  root.innerHTML = `<div class="summary">
    <h2>${r.length ? `${r.length}문제를 풀었어요` : '이번에는 모두 건너뛰었어요'}</h2>
    <div class="sheet" aria-hidden="true">${r.map(x => `<span class="gz">${MARK[x.outcome]}</span>`).join('')}</div>
    <p class="sheet-legend">○ 한 번에 ${c.first}개, △ 고쳐서 ${c.retry}개, / 놓친 단어 ${c.miss}개${sess.passed ? `, 건너뛴 단어 ${sess.passed}개` : ''}</p>
    ${review.length ? `<h3>다시 볼 단어</h3><ul class="wl">${review.map(w => `
      <li class="rv"><span class="w-han" lang="zh-CN">${ruby(w.hz, w.py)}</span><span class="w-mean">${esc(w.mean)}</span>
      ${TTS ? `<button type="button" class="btn ghost sm" data-act="say" data-hz="${esc(w.hz)}" aria-label="${esc(w.hz)} 발음 듣기">${ICON.play}</button>` : '<span></span>'}</li>`).join('')}</ul>`
      : '<p class="lead" style="margin-top:14px">모두 한 번에 맞혔어요.</p>'}
    <div class="actions col"><button type="button" class="btn primary big" data-act="again">한 번 더 하기</button><button type="button" class="btn ghost" data-act="towords">단어장 보기</button></div>
  </div>`;
}

function bindQuiz(mode) {
  const root = $(`#${mode}-root`);
  root.addEventListener('keydown', e => {
    if (e.target.id === 'kbd-in' && e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); onKbdCheck(sessions[mode]); }
  });
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || !root.contains(b) || b.disabled) return;
    const act = b.dataset.act;
    const sess = sessions[mode];
    const w = sess && itemOf(sess);
    switch (act) {
      case 'fillpos': busy(b, '채우는 중…', fillGaps); break;
      case 'pad+': if (sess) zoomPads(sess, 0.2); break;
      case 'pad-': if (sess) zoomPads(sess, -0.2); break;
      case 'towords': go('words'); setTimeout(() => $('#add-input').focus(), 50); break;
      case 'len': S.settings.len = +b.dataset.v; touchSettings(); renderQuiz(mode); break;
      case 'start': case 'again': startSession(mode, b); break;
      case 'quit': abortListening(); if (sess) sess.phase = sess.results.length ? 'summary' : 'start'; renderQuiz(mode); break;
      case 'mic': onMic(sess); break;
      case 'kbd-check': onKbdCheck(sess); break;
      case 'use-kbd': if (sess && sess.phase === 'ask') { abortListening(); sess.listening = false; switchToKbd(sess); renderQuiz(mode); } break;
      case 'use-mic': if (sess && sess.phase === 'ask') { srBlocked = false; S.settings.spMethod = 'auto'; touchSettings(); sess.method = spMethod(); sess.msg = null; sess.srStalls = 0; renderQuiz(mode); } break;
      case 'use-self': if (sess && sess.phase === 'ask') { S.settings.spMethod = 'self'; touchSettings(); sess.method = 'self'; sess.msg = null; renderQuiz(mode); } break;
      case 'selfcheck': if (sess && w) { sess.phase = 'selfcheck'; renderQuiz(mode); if (S.settings.autoSpeak) speak(w.hz); } break;
      case 'self-ok': if (sess) finish(sess, sess.fails === 0 ? 'first' : 'retry'); break;
      case 'self-miss': if (sess) { sess.fails = 3; finish(sess, 'miss'); } break;
      case 'skip': if (sess && sess.phase === 'ask' && !sess.busy) skipQuestion(sess); break;
      case 'giveup': if (sess && !sess.busy) { sess.fails = 3; sess.gaveUp = true; finish(sess, 'miss'); } break;
      case 'next':
        if (!sess) break;
        sess.idx++;
        if (sess.idx >= sess.total) sess.phase = 'summary'; else loadQuestion(sess);
        renderQuiz(mode); window.scrollTo(0, 0); break;
      case 'listen': if (w) speak(w.hz); break;
      case 'say': speak(b.dataset.hz); break;
      case 'override': if (sess) override(sess); break;
      case 'undo': if (sess && sess.phase === 'ask' && !sess.busy) { const i = sess.hist.pop(); if (i != null) sess.strokes[i].pop(); renderQuiz(mode); } break;
      case 'clear': if (sess && sess.phase === 'ask' && !sess.busy) { sess.strokes.forEach(s => { s.length = 0; }); sess.hist = []; sess.bad = null; renderQuiz(mode); } break;
      case 'clearbox': if (sess && sess.phase === 'ask' && !sess.busy) { const i = +b.dataset.i; sess.strokes[i].length = 0; sess.hist = sess.hist.filter(x => x !== i); if (sess.bad) sess.bad = sess.bad.filter(x => x !== i); renderQuiz(mode); } break;
      case 'submit': submitWriting(sess); break;
      case 'use-free': if (sess && sess.phase === 'ask') { stopWriters(sess); sess.hw = false; sess.padsEl = null; sess.writers = []; sess.strokes = chars(w.hz).map(() => []); sess.hist = []; sess.msg = null; S.settings.wrMethod = 'self'; touchSettings(); renderQuiz(mode); } break;
      case 'use-hw': if (sess && sess.phase === 'ask' && window.HanziWriter) { sess.hw = true; sess.hwFail = false; sess.padsEl = null; sess.msg = null; S.settings.wrMethod = 'stroke'; touchSettings(); renderQuiz(mode); } break;
    }
  });
}

        showHintAfterMisses: 3, highlightOnComplete: true, leniency: 1.35,
        acceptBackwardsStrokes: !!S.settings.backStroke,
        onLoadCharDataError: () => toast('이 글자의 획순 정보를 받지 못했어요. 인터넷 연결을 확인해 주세요.'),
      });
    } catch (e) { return; }
    PR.writers.push(wr);
    try { wr.quiz({ onComplete: () => { try { wr.showCharacter(); } catch (e) {} } }); } catch (e) {}
  });
}
async function practiceAnimate() {
  const w = byId(PR.id); if (!w) return;
  stopPractice();
  for (const wr of PR.writers.slice()) { try { wr.cancelQuiz(); } catch (e) {} }
  const holder = $('#pr-pads'); if (!holder) return;
  const boxes = $$('.hw-box', holder);
  const cs = chars(w.hz);
  const size = padSize(cs.length);
  const ink = inkColor(), soft = cssVar('--grid-soft', '#C4DBCE');
  PR.writers = [];
  for (let i = 0; i < boxes.length; i++) {
    boxes[i].innerHTML = '';
    const wr = HanziWriter.create(boxes[i], cs[i], {
      width: size - 3, height: size - 3, padding: Math.round(size * 0.08),
      showOutline: true, showCharacter: false, strokeColor: ink, outlineColor: soft,
      strokeAnimationSpeed: 1.1, delayBetweenStrokes: 220,
    });
    PR.writers.push(wr);
  }
  for (const wr of PR.writers) {
    await new Promise(res => { try { wr.animateCharacter({ onComplete: res }); } catch (e) { res(); } setTimeout(res, 8000); });
  }
}

async function onSettingsAction(b) {
  const act = b.dataset.set; const d = $('#dlg-settings');
  if (act === 'close') { d.close(); return; }
  if (act === 'pass') { S.settings.pass = +b.dataset.v; touchSettings(); openSettings(); return; }
  if (act === 'len') { S.settings.len = +b.dataset.v; touchSettings(); openSettings(); return; }
  if (act === 'method') { S.settings.spMethod = b.dataset.v; if (b.dataset.v === 'auto') srBlocked = false; touchSettings(); if (sessions.sp && sessions.sp.phase === 'ask') { sessions.sp.method = spMethod(); renderQuiz('sp'); } openSettings(); return; }
  if (act === 'speak') { S.settings.autoSpeak = !S.settings.autoSpeak; touchSettings(); b.setAttribute('aria-checked', String(S.settings.autoSpeak)); return; }
  if (act === 'backstroke') { S.settings.backStroke = !S.settings.backStroke; touchSettings(); b.setAttribute('aria-checked', String(S.settings.backStroke)); return; }
  if (act === 'fillpos') { fillPos(true); return; }
  if (act === 'wrmethod') { S.settings.wrMethod = b.dataset.v; touchSettings(); openSettings(); return; }
  if (act === 'export') { exportBackup(); return; }
  if (act === 'import') { $('#file-import').click(); return; }
  if (act === 'resetall') {
    if (!(await askConfirm('모든 단어의 말하기와 쓰기 기록을 처음으로 돌릴까요? 단어는 그대로 남아요.', '초기화', true))) return;
    S.words.forEach(w => { w.sp = stat(); w.wr = stat(); w.sn = stat(); });
    sessions.sp = null; sessions.wr = null; sessions.sn = null;
    touch(...S.words); renderWords(); toast('학습 기록을 초기화했어요.');
  }
}
function markBackup() { S.settings.lastBackup = Date.now(); touchSettings(); }
async function exportBackup() {
  flush();
  const data = JSON.stringify({ app: 'shengciben', v: 1, exported: new Date().toISOString(), words: S.words, settings: S.settings });
  const name = `shengciben-backup-${new Date().toISOString().slice(0, 10)}.json`;
  try {
    const file = new File([data], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: '새 단어 공책 백업' });
      markBackup(); toast('백업 파일을 보냈어요. 파일 앱이나 카톡 나에게 보내기에 저장해 두세요.'); return;
    }
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    markBackup(); toast('백업 파일을 내려받았어요.'); return;
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const d = $('#dlg-backup');
  d.innerHTML = `<div class="dlg-in"><p class="dlg-title">백업 내용</p>
    <p class="help" style="margin-top:6px">파일로 저장하지 못했어요. 아래 내용을 모두 복사해 메모장에 붙여 넣고 .json 파일로 저장해 두세요.</p>
    <textarea class="backup" readonly>${esc(data)}</textarea>
    <div class="dlg-foot end"><button type="button" class="btn ghost" data-b="copy">복사</button><button type="button" class="btn primary" data-b="close">닫기</button></div></div>`;
  d.querySelector('[data-b="close"]').onclick = () => d.close();
  d.querySelector('[data-b="copy"]').onclick = async () => {
    const ta = d.querySelector('textarea');
    try { await navigator.clipboard.writeText(ta.value); toast('복사했어요.'); }
    catch (e) { ta.focus(); ta.select(); toast('내용을 길게 눌러 복사해 주세요.'); }
  };
  d.showModal();
}
async function importBackup(file) {
  let d;
  try { d = JSON.parse(await file.text()); } catch (e) { toast('백업 파일을 읽지 못했어요. 이 앱에서 저장한 .json 파일인지 확인해 주세요.'); return; }
  if (!d || !Array.isArray(d.words)) { toast('단어가 들어 있지 않은 파일이에요.'); return; }
  const words = d.words.map(normWord).filter(Boolean);
  if (!(await askConfirm(`백업에 있는 단어 ${words.length}개로 지금 단어장을 바꿀까요? 지금 단어장은 사라져요.`, '바꾸기', true))) return;
  S.words = words;
  if (d.settings) S.settings = { ...S.settings, ...d.settings };
  sessions.sp = null; sessions.wr = null; sessions.sn = null;
  touch(...words); touchSettings(); renderWords();
  const ds = $('#dlg-settings'); if (ds.open) ds.close();
  toast(`단어 ${words.length}개를 불러왔어요.`);
}

/* ───────── 연결 ───────── */
function bind() {
  $$('.nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  const inp = $('#add-input');
  $('#add-btn').addEventListener('click', e => { const v = inp.value; inp.value = ''; busy(e.currentTarget, '찾는 중…', () => addWords(v)); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); const v = inp.value; inp.value = ''; addWords(v); }
  });
  $('#try-sample').addEventListener('click', () => addWords('你好 谢谢 再见'));
  $('#btn-fill').addEventListener('click', e => busy(e.currentTarget, '채우는 중…', fillGaps));
  $('#search').addEventListener('input', renderWords);
  $('#sort').addEventListener('change', renderWords);
  $('#word-list').addEventListener('click', e => { const b = e.target.closest('.w'); if (b) openEdit(b.dataset.id); });
  $('#dlg-edit').addEventListener('click', e => {
    if (e.target === e.currentTarget) { e.currentTarget.close(); return; }
    const b = e.target.closest('[data-ed]'); if (b && !b.disabled) onEditAction(b.dataset.ed);
  });
  $('#dlg-edit').addEventListener('input', e => {
    if (e.target.id !== 'ed-py') return;
    const w = byId(editId); if (!w) return;
    $('#ed-preview').innerHTML = ruby(w.hz, parsePyInput(e.target.value, w.hz));
  });
  $('#btn-settings').addEventListener('click', openSettings);
  $('#dlg-settings').addEventListener('input', e => {
    if (e.target.id !== 'wrmiss') return;
    const v = +e.target.value || 0;
    S.settings.wrMiss = v;
    touchSettings();
    const lab = $('#wrmiss-val'); if (lab) lab.textContent = v ? v + '획' : '제한 없음';
  });
  $('#dlg-settings').addEventListener('click', e => {
    if (e.target === e.currentTarget) { e.currentTarget.close(); return; }
    const b = e.target.closest('[data-set]'); if (b) onSettingsAction(b);
  });
  $('#dlg-practice').addEventListener('click', e => {
    if (e.target === e.currentTarget) { stopPractice(); e.currentTarget.close(); return; }
    const b = e.target.closest('[data-pr]'); if (!b) return;
    const act = b.dataset.pr;
    const w = byId(PR.id);
    if (act === 'close') { stopPractice(); $('#dlg-practice').close(); return; }
    if (!w) return;
    if (act === 'listen') { speak(w.hz); return; }
    if (act === 'animate') { practiceAnimate(); return; }
    if (act === 'reset') { mountPractice(w); return; }
    if (act === 'outline') { PR.outline = !PR.outline; openPractice(PR.id); return; }
    if (act === 'big' || act === 'small') {
      const cur = +S.settings.padScale || 1;
      S.settings.padScale = Math.min(2.4, Math.max(0.7, Math.round((cur + (act === 'big' ? 0.2 : -0.2)) * 100) / 100));
      touchSettings(); mountPractice(w);
    }
  });
  $('#dlg-backup').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
  $('#file-import').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) importBackup(f); });
  bindQuiz('sp'); bindQuiz('wr'); bindQuiz('sn');
  let rt = null;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      const s = sessions[view];
      if (isWrite(view) && s && !(useHW(s) && s.phase === 'ask') && ['ask', 'selfcheck', 'reveal'].includes(s.phase) && Math.abs($('#main').clientWidth - lastPadWidth) > 4) renderQuiz(view);
    }, 180);
  });
}

load();
bind();
go('words');
if (!storageOK) toast('이 브라우저에서는 단어장이 저장되지 않을 수 있어요. 설정에서 백업을 저장해 두세요.');
(() => {
  const st = S.settings, now = Date.now(), DAY = 86400000;
  if (S.words.length >= 10 && now - (st.lastBackup || 0) > 30 * DAY && now - (st.lastNag || 0) > 7 * DAY) {
    st.lastNag = now; touchSettings();
    setTimeout(() => toast('백업한 지 한 달이 넘었어요.', { label: '지금 백업', fn: exportBackup }), 1500);
  }
})();
/* 뜻이나 품사가 비어 있는 단어를 조용히 채워요 */
setTimeout(async () => {
  if (navigator.onLine === false) return;
  const noMean = S.words.filter(w => !w.mean).slice(0, 10);
  if (noMean.length) await lookup(noMean, true);
  fillPos(false);
}, 3000);
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
